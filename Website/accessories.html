<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessories</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <button id="menu-btn" class="icon-btn"><i class="fas fa-bars"></i></button>
        <div class="logo-text" onclick="window.location.href='index.html'">GP</div>
        <button id="user-btn" class="icon-btn"><i class="far fa-user"></i></button>
    </header>

    <main>
        <div class="video-placeholder">Accessories Campaign</div>

        <div class="accessories-grid">
            <div class="accessory-item">
                <img src="https://via.placeholder.com/150?text=Strap+1" alt="Strap">
                <div class="accessory-name">1973 British Military NATO Strap</div>
                <button class="btn-small">Add To Cart</button>
            </div>
            <div class="accessory-item">
                <img src="https://via.placeholder.com/150?text=Strap+2" alt="Strap">
                <div class="accessory-name">Rubber Ocean Strap (Orange)</div>
                <button class="btn-small">Add To Cart</button>
            </div>
            <div class="accessory-item">
                <img src="https://via.placeholder.com/150?text=Strap+3" alt="Strap">
                <div class="accessory-name">Canvas Warrior Strap - Sand</div>
                <button class="btn-small">Add To Cart</button>
            </div>
            <div class="accessory-item">
                <img src="https://via.placeholder.com/150?text=Strap+4" alt="Strap">
                <div class="accessory-name">Canvas Warrior Strap - Grey</div>
                <button class="btn-small">Add To Cart</button>
            </div>
        </div>
    </main>
    
    <div id="utility-menu" class="overlay">
        <div class="overlay-header">
            <button id="close-utility" class="icon-btn"><i class="fas fa-times"></i></button>
            <div class="logo-text">GP</div>
            <div style="width: 44px;"></div>
        </div>
        <ul class="menu-list">
            <li onclick="window.location.href='index.html'">Home <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='accessories.html'">Accessories <i class="fas fa-chevron-right"></i></li>
        </ul>
    </div>

    <script src="../Javascript/script.js"></script>
</body>
</html>
