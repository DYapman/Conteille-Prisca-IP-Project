<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Contielle Prisca</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <button id="menu-btn" class="icon-btn"><i class="fas fa-bars"></i></button>
        <div class="logo-text" onclick="window.location.href='index.html'"></div>
        <button id="cart-btn" class="icon-btn"><i class="fas fa-shopping-bag"></i></button>
    </header>

    <div id="utility-menu" class="overlay">
        <div class="overlay-header">
            <button id="close-utility" class="icon-btn"><i class="fas fa-times"></i></button>
            <div class="logo-text"></div>
            <button id="open-cart-from-menu" class="icon-btn"><i class="fas fa-shopping-bag"></i></button>
        </div>
        <ul class="menu-list">
            <li onclick="window.location.href='index.html'">Watches <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='accessories.html'">Accessories <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='membership.html'">Membership <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='athletes.html'">Athletes <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='community.html'">Community <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='profile.html'">Profile <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='settings.html'">Settings <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='about.html'">About Us <i class="fas fa-chevron-right"></i></li>
        </ul>
    </div>

    <div id="cart-menu" class="overlay overlay-right">
        <div class="overlay-header">
            <button id="open-menu-from-cart" class="icon-btn"><i class="fas fa-bars"></i></button>
            <div class="logo-text"></div>
            <button id="close-cart" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-content">
            </div>
    </div>

    <div class="page-container profile-page">
        
        <div class="profile-hero">
            <div class="profile-avatar-large" id="profile-initials">--</div>
            <h1 class="profile-name" id="profile-name">Loading...</h1>
            <div class="profile-stats">
                <span id="connection-count">4 Connections</span>
                <span class="separator">•</span>
                <span id="member-since">Since 2020</span>
            </div>
        </div>

        <div class="profile-tabs">
            <button class="tab-btn active" onclick="switchTab('forum')">Forum Posts</button>
            <button class="tab-btn" onclick="switchTab('connections')">Connections</button>
            <button class="tab-btn" onclick="switchTab('badges')">Badges</button>
        </div>

        <div class="tab-content-container">
            
            <div id="forum-tab" class="tab-pane active">
                <div class="empty-state-box">
                    <p>No posts yet...</p>
                </div>
                
            </div>

            <div id="connections-tab" class="tab-pane">
    <div class="connections-list" id="connections-container">
                    <div class="connection-card">
                        <div class="conn-avatar">AU</div>
                        <span class="conn-name">Adilah Uo</span>
                    </div>
                    <div class="connection-card">
                        <div class="conn-avatar">AZ</div>
                        <span class="conn-name">Aryton Zola</span>
                    </div>
                    <div class="connection-card">
                        <div class="conn-avatar">MS</div>
                        <span class="conn-name">Madeline Swann</span>
                    </div>
                    <div class="connection-card">
                        <div class="conn-avatar">JV</div>
                        <span class="conn-name">June Vargas</span>
                    </div>
                </div>
            </div>

            <div id="badges-tab" class="tab-pane">
                <div class="badges-list" id="full-badges-list">
                    </div>
            </div>

        </div>
    </div>

    <footer class="site-footer">
        <label class="newsletter-label">Subscribe to our newsletter</label>
        <div class="input-group">
            <input type="email" placeholder="Email" class="email-input">
            <button class="submit-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="footer-divider"></div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-tiktok"></i>
            <i class="fas fa-times"></i>
        </div>
    </footer>

    <script src="../Javascript/script.js"></script>
    <script>
        // Tab Switcher Logic
        function switchTab(tabName) {
            // Remove active class from all buttons and panes
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

            // Add active class to clicked button and corresponding pane
            document.querySelector(`button[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }
    </script>
</body>
</html>
