<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <button id="menu-btn" class="icon-btn"><i class="fas fa-bars"></i></button>
        <div class="logo-text" onclick="window.location.href='index.html'"></div>
        <button id="cart-btn" class="icon-btn"><i class="fas fa-shopping-bag"></i></button>
    </header>

    <div class="page-container">
    <img src="https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?auto=format&fit=crop&w=800&q=80" alt="Bronze Watch" class="hero-image">

    <div class="split-showcase">
        
        <div class="split-panel split-left" onclick="window.location.href='seamariner.html'">
            <div class="split-overlay"></div>
            <img src="../Photos/seamarinerINDEX.png" alt="Sea Mariner" class="split-bg">
            <div class="split-content">
                <h2 class="split-title">Sea Mariner</h2>
                <p class="split-subtitle">The Icon of the Deep</p>
                <a href="seamariner.html" class="btn-split">Explore</a>
            </div>
        </div>

        <div class="split-panel split-right" onclick="window.location.href='novus-flux.html'">
            <div class="split-overlay"></div>
            <img src="../Photos/novusINDEX.png" alt="Novus Flux" class="split-bg">
            <div class="split-content">
                <h2 class="split-title">Novus Flux</h2>
                <p class="split-subtitle">The Future of Time</p>
                <a href="novus-flux.html" class="btn-split">Explore</a>
            </div>
        </div>

    </div>
    </div>
    <footer class="site-footer">
        <label class="newsletter-label">Subscribe to our newsletter</label>
        <div class="input-group">
            <input type="email" placeholder="Email" class="email-input">
            <button class="submit-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="footer-divider"></div>
        <div class="social-icons">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-tiktok"></i>
            <i class="fas fa-times"></i>
        </div>
    </footer>

    <div id="utility-menu" class="overlay">
        <div class="overlay-header">
            <button id="close-utility" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="menu-list">
            <li onclick="window.location.href='index.html'">Watches <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='accessories.html'">Accessories <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='membership.html'">Membership <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='athletes.html'">Athletes <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='community.html'">Community <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='rank.html'">Rank <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='profile.html'">Profile <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='settings.html'">Settings <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='about.html'">About Us <i class="fas fa-chevron-right"></i></li>
        </ul>
    </div>

    <div id="cart-menu" class="overlay overlay-right">
        <div class="overlay-header" style="justify-content: flex-end;">
            <button id="close-cart" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-content">
            <div class="cart-title">YOUR CART (1)</div>
            <div class="cart-item">
                <img src="https://via.placeholder.com/100" alt="Watch">
                <div>
                    <div>Sea Mariner NATO</div>
                    <div class="qty-selector"><button class="qty-btn">-</button><input class="qty-input" value="1"><button class="qty-btn">+</button></div>
                    <div class="cart-price">$7,100.00</div>
                </div>
            </div>
            <div class="delivery-box">Delivery within 48 hours</div>
            <div class="cart-footer">
                <button class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <script src="../Javascript/script.js"></script>
</body>
</html>
