<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Watches</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <button id="menu-btn" class="icon-btn"><i class="fas fa-bars"></i></button>
        <div class="logo-text" onclick="window.location.href='index.html'">GP</div>
        <button id="user-btn" class="icon-btn"><i class="far fa-user"></i></button>
    </header>

    <main class="homepage-container">
        <div class="video-placeholder">
            <i class="fas fa-play"></i> &nbsp; Brand Campaign Film
        </div>

        <div class="collection-grid">
            <div class="collection-item">
                <img src="https://via.placeholder.com/500x350/1a2238/ffffff?text=Sea+Mariner" alt="Sea Mariner">
                <div class="collection-info">
                    <h2>Sea Mariner</h2>
                    <a href="seamariner.html" class="btn-outline">Discover The Collection</a>
                </div>
            </div>

            <div class="collection-item">
                <img src="https://via.placeholder.com/500x350/333333/ffffff?text=Novus+Flux" alt="Novus Flux">
                <div class="collection-info">
                    <h2>Novus Flux</h2>
                    <a href="novus-flux.html" class="btn-outline">Discover The Collection</a>
                </div>
            </div>
        </div>
    </main>

    <div id="utility-menu" class="overlay">
        <div class="overlay-header">
            <button id="close-utility" class="icon-btn"><i class="fas fa-times"></i></button>
            <div class="logo-text">GP</div>
            <div style="width: 44px;"></div>
        </div>
        <ul class="menu-list">
            <li onclick="window.location.href='index.html'">Watches <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='accessories.html'">Accessories <i class="fas fa-chevron-right"></i></li>
            <li>Membership <i class="fas fa-chevron-right"></i></li>
        </ul>
    </div>

    <div id="account-menu" class="overlay overlay-right">
        <div class="overlay-header">
            <div style="width: 44px;"></div>
            <div class="logo-text">GP</div>
            <button id="close-account" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <ul class="menu-list">
            <li>Profile <i class="fas fa-chevron-right"></i></li>
            <li>Settings <i class="fas fa-chevron-right"></i></li>
        </ul>
    </div>

    <script src="../Javascript/script.js"></script>
</body>
</html>
