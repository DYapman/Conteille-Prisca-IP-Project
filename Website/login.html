<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Conteille Prisca</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo" onclick="window.location.href='index.html'" title="Return to Home"></div>
            
            <h1 class="auth-title">Login</h1>
            <p class="auth-subtitle">Welcome back to the club</p>

            <form class="auth-form">
                <div class="input-group-auth">
                    <label>EMAIL OR PHONE</label>
                    <input type="text" class="auth-input" placeholder="name@example.com">
                </div>
                
                <div class="input-group-auth">
                    <label>PASSWORD</label>
                    <input type="password" class="auth-input" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-auth">Login</button>
            </form>

            <div class="auth-links">
                <a href="#">Forgot Password?</a>
                <br><br>
                <span>Don't have an account? <a href="register.html">Register</a></span>
            </div>

            <div class="social-login">
                <p style="margin-bottom: 15px; font-size: 0.8rem; color: #888;">OR LOGIN WITH</p>
                <div class="social-icons-auth">
                    <i class="fab fa-google"></i>
                    <i class="fab fa-apple"></i>
                    <i class="fab fa-facebook-f"></i>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
