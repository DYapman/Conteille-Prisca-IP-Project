<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Contielle Prisca</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-card" style="max-width: 500px;">
        <div class="auth-logo" onclick="window.location.href='index.html'" title="Return Home"></div>

        <div class="auth-header">
            <h1 class="auth-title register-title">Register</h1>
        </div>

        <form>
            <div class="section-label">Personal Information</div>

            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Gender</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Date of Birth (Optional)</label>
                <input type="date" class="form-input" placeholder="00/00/0000">
            </div>

            <div class="form-group">
                <label class="form-label">Email*</label>
                <input type="email" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Mobile Number*</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" class="form-input" value="SG (+65)" readonly style="width: 30%; background: #f9f9f9;">
                    <input type="tel" class="form-input" style="width: 70%;">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Re-enter Password</label>
                <input type="password" class="form-input">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="promo">
                <label for="promo">Receive Promotional News</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Terms and Conditions of use</label>
            </div>

            <button type="submit" class="btn-login btn-register-outline">Register</button>
        </form>

        <p style="margin-top: 20px; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: bold;">Login</a>
        </p>
    </div>

</body>
</html>
