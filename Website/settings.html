<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Contielle Prisca</title>
    
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="settings-container">
        
        <header>
            <button id="menu-btn" class="icon-btn">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="logo-text" onclick="window.location.href='index.html'"></div>

            <button id="cart-btn" class="icon-btn">
                <i class="fas fa-shopping-bag"></i>
            </button>
        </header>

        <div class="profile-header">
            <div class="profile-avatar"></div>
            <h1>Username</h1>
            <p class="member-id">Member ID</p>
        </div>

        <form class="settings-form">
            <input type="hidden" id="settings-id">

            <div class="settings-input-group">
                <label>Mobile Number</label>
                <input type="number" id="settings-mobile" class="settings-input-box" placeholder="Enter mobile number">
            </div>

            <div class="settings-input-group">
                <label>Email Address</label>
                <input type="email" id="settings-email" class="settings-input-box" placeholder="Enter email">
            </div>

            <div class="settings-input-group">
                <label>Password</label>
                <input type="text" id="settings-pass" class="settings-input-box" placeholder="Enter new password">
            </div>

            <div class="settings-input-group">
                <label>Date of Birth</label>
                <input type="date" id="settings-dob" class="settings-input-box">
            </div>

            <div class="form-footer">
    <button type="submit" class="update-btn">Update Profile</button>
    
    <button type="button" id="logout-btn" style="background:transparent; margin-top: 15px;" class="update-btn">
        Log Out
    </button>
</div>
        
        </form>
    </div>

    <div id="utility-menu" class="overlay">
        <div class="overlay-header">
            <button id="close-utility" class="icon-btn"><i class="fas fa-times"></i></button>
            <div class="logo-text"></div>
            <button id="open-cart-from-menu" class="icon-btn"><i class="fas fa-shopping-bag"></i></button>
        </div>
        <ul class="menu-list">
            <li onclick="window.location.href='index.html'">Watches <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='accessories.html'">Accessories <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='membership.html'">Membership <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='athletes.html'">Athletes <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='community.html'">Community <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='settings.html'">Settings <i class="fas fa-chevron-right"></i></li>
            <li onclick="window.location.href='about.html'">About Us <i class="fas fa-chevron-right"></i></li>
        </ul>
    </div>

    <div id="cart-menu" class="overlay overlay-right">
        <div class="overlay-header">
            <button id="open-menu-from-cart" class="icon-btn"><i class="fas fa-bars"></i></button>
            <div class="logo-text"></div>
            <button id="close-cart" class="icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-content">
            <div style="font-weight:bold; margin-bottom:20px;">YOUR CART (1)</div>
            <div class="cart-item">
                <img src="../Photos/bluefish.png" alt="Watch">
                <div>
                    <div>Sea Mariner NATO</div>
                    <div class="qty-selector"><button class="qty-btn">-</button><input class="qty-input" value="1"><button class="qty-btn">+</button></div>
                    <div class="cart-price">$7,100.00</div>
                </div>
            </div>
            <div class="delivery-box">Delivery within 48 hours</div>
            <div class="cart-footer">
                <button class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <script src="../Javascript/script.js"></script>
</body>
</html>
