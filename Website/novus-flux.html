<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novus Flux</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <header>
        <button id="menu-btn" class="nav-icon"><i class="fas fa-bars"></i></button>
        <div class="logo"><a href="index.html"><img src="https://via.placeholder.com/50x50/1a1a1a/c5a059?text=GP" alt="Logo"></a></div>
        <button id="account-btn" class="nav-icon"><i class="far fa-user"></i></button>
    </header>

    <main>
        <div class="video-placeholder"></div>
        
        <div class="product-info">
            <h2>Novus Flux</h2>
            <div class="price">SGD$16,700</div>
            
            <button class="btn-primary">Add to Cart</button>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <div class="accordion-item">
                <button class="accordion-header">Description <span class="accordion-icon">+</span></button>
                <div class="accordion-content"><p>Modern digital durability meets luxury design.</p></div>
            </div>
            <div class="accordion-item">
                <button class="accordion-header">Features <span class="accordion-icon">+</span></button>
                <div class="accordion-content"><p>Bluetooth connectivity, Solar power.</p></div>
            </div>
            <div class="accordion-item">
                <button class="accordion-header">Technical Data <span class="accordion-icon">+</span></button>
                <div class="accordion-content"><p>Module 3459, Titanium Housing.</p></div>
            </div>
            <div class="accordion-item">
                <button class="accordion-header">Strap <span class="accordion-icon">+</span></button>
                <div class="accordion-content"><p>Resin band with buckle.</p></div>
            </div>

            <div class="features-grid">
                <div class="feature-box"><i class="far fa-compass"></i><span>Superior Precision</span></div>
                <div class="feature-box"><i class="fas fa-shield-alt"></i><span>10-Year Warranty</span></div>
                <div class="feature-box"><i class="fas fa-bolt"></i><span>Shock Resistance</span></div>
                <div class="feature-box"><i class="fas fa-tint"></i><span>Water Resistance</span></div>
            </div>

            <div class="tech-image">
                <img src="https://via.placeholder.com/150/003300/FFFFFF?text=Circuit" alt="Circuit Board">
            </div>
        </div>
    </main>

    <div id="utility-menu" class="overlay-menu">
        <div class="menu-header">
            <button class="nav-icon close-menu-btn"><i class="fas fa-times"></i></button>
            <div class="logo">GP</div>
            <button class="nav-icon"><i class="far fa-user"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html">Watches</a></li>
            <li><a href="accessories.html">Accessories</a></li>
        </ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
